<!DOCTYPE html>
<html>
<head>
    <title>Student API</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Management</h1>

    <h2 id="formTitle">Add Student</h2>

    <input type="text" id="name" placeholder="Enter name">

    <input
        type="number"
        id="age"
        placeholder="Enter age"
        min="1"
    >

    <input type="text" id="course" placeholder="Enter course">

    <button id="submitBtn" onclick="addStudent()">
        Add Student
    </button>

    <hr>

    <button onclick="window.location.href='students.html'">
        View All Students
    </button>

    <script src="script.js"></script>

</body>
</html>
